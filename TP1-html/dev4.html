<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercice 4 - Vidéo HTML5</title>
</head>

<body>

    <h1>Vidéo HTML5</h1>

    <video
        controls
        autoplay
        loop
        preload="auto"
        width="640"
    >

        <source src="media/video.mp4" type="video/mp4">

        <!-- Solution de secours Flash -->
        <object
            data="media/video.swf"
            type="application/x-shockwave-flash"
            width="640"
            height="360"
        >
            <p>
                Votre navigateur ne supporte pas la vidéo HTML5
                ni Flash.
            </p>

            <p>
                <a href="media/video.mp4">
                    Télécharger la vidéo
                </a>
            </p>

        </object>

    </video>

</body>

</html>
